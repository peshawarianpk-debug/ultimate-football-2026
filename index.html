<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ultimate Football 2026</title>

<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
}

body {
  margin: 0;
  overflow: hidden;
  background: #168a35;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: #168a35;
  overflow: hidden;
}

#pitch {
  position: absolute;
  left: 3%;
  top: 5%;
  width: 94%;
  height: 90%;
  border: 5px solid white;
  background:
    repeating-linear-gradient(
      90deg,
      #15913a 0px,
      #15913a 80px,
      #128334 80px,
      #128334 160px
    );
}

.line {
  position: absolute;
  background: white;
}

.midline {
  left: 50%;
  top: 0;
  width: 4px;
  height: 100%;
  transform: translateX(-50%);
}

.circle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 150px;
  height: 150px;
  border: 4px solid white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.goal {
  position: absolute;
  top: 35%;
  width: 5%;
  height: 30%;
  border: 5px solid white;
  background: rgba(255,255,255,0.12);
}

#leftGoal {
  left: -5%;
}

#rightGoal {
  right: -5%;
}

.player,
.bot,
.ball {
  position: absolute;
  z-index: 5;
  transform: translate(-50%, -50%);
}

.player,
.bot {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 25px;
}

.player {
  background: #1677ff;
}

.bot {
  background: #e32626;
}

.ball {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: white;
  border: 3px solid black;
  z-index: 10;
}

#score {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 28px;
  font-weight: bold;
  z-index: 30;
}

#timer {
  position: absolute;
  top: 48px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 20px;
  z-index: 30;
}

/* MOBILE CONTROLS */

#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 15px;
  height: 170px;
  z-index: 100;
  pointer-events: none;
}

#joystick {
  position: absolute;
  left: 25px;
  bottom: 15px;
  width: 135px;
  height: 135px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 3px solid rgba(255,255,255,0.6);
  pointer-events: auto;
}

#stick {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.65);
  border: 3px solid white;
}

#shootButton {
  position: absolute;
  right: 30px;
  bottom: 35px;
  width: 105px;
  height: 105px;
  border-radius: 50%;
  border: 4px solid white;
  background: rgba(230,30,30,0.8);
  color: white;
  font-size: 20px;
  font-weight: bold;
  pointer-events: auto;
}

@media (min-width: 800px) {
  #controls {
    display: none;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="pitch">
    <div class="line midline"></div>
    <div class="circle"></div>

    <div id="leftGoal" class="goal"></div>
    <div id="rightGoal" class="goal"></div>

    <div id="player" class="player">⚽</div>
    <div id="bot" class="bot">🤖</div>
    <div id="ball" class="ball"></div>
  </div>

  <div id="score">BLUE 0 - 0 RED</div>
  <div id="timer">90</div>

  <div id="controls">
    <div id="joystick">
      <div id="stick"></div>
    </div>

    <button id="shootButton">SHOOT</button>
  </div>

</div>

<script>
const player = document.getElementById("player");
const bot = document.getElementById("bot");
const ball = document.getElementById("ball");
const scoreText = document.getElementById("score");
const timerText = document.getElementById("timer");

let playerX = 25;
let playerY = 50;

let botX = 75;
let botY = 50;

let ballX = 50;
let ballY = 50;

let ballVX = 0;
let ballVY = 0;

let blueScore = 0;
let redScore = 0;

let timeLeft = 90;

let playerDirection = 1;
let keys = {};

let joystickX = 0;
let joystickY = 0;

document.addEventListener("keydown", function(e) {
  keys[e.key.toLowerCase()] = true;

  if (e.code === "Space") {
    e.preventDefault();
    shoot();
  }
});

document.addEventListener("keyup", function(e) {
  keys[e.key.toLowerCase()] = false;
});

/* PLAYER SHOOT */

function shoot() {

  const distance = Math.hypot(
    ballX - playerX,
    ballY - playerY
  );

  if (distance < 8) {

    /* LEFT OR RIGHT */
    ballVX = playerDirection * 1.8;

    /* Small vertical movement based on joystick */
    ballVY = joystickY * 0.8;

    /* If using keyboard W/S */
    if (keys["w"]) ballVY = -0.8;
    if (keys["s"]) ballVY = 0.8;
  }
}

/* BOT SHOOT */

function botShoot() {

  const distance = Math.hypot(
    ballX - botX,
    ballY - botY
  );

  if (distance < 7) {

    /* Bot always shoots toward LEFT goal */
    ballVX = -1.5;

    /* Random slight vertical direction */
    ballVY = (Math.random() - 0.5) * 0.8;
  }
}

/* JOYSTICK */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickActive = false;

function moveJoystick(clientX, clientY) {

  const rect = joystick.getBoundingClientRect();

  let x = clientX - (rect.left + rect.width / 2);
  let y = clientY - (rect.top + rect.height / 2);

  const max = 38;

  const distance = Math.hypot(x, y);

  if (distance > max) {
    x = x / distance * max;
    y = y / distance * max;
  }

  stick.style.left = `calc(50% + ${x}px)`;
  stick.style.top = `calc(50% + ${y}px)`;

  joystickX = x / max;
  joystickY = y / max;

  if (Math.abs(joystickX) > 0.2) {
    playerDirection = joystickX > 0 ? 1 : -1;
  }
}

joystick.addEventListener("touchstart", function(e) {
  joystickActive = true;
  moveJoystick(
    e.touches[0].clientX,
    e.touches[0].clientY
  );
});

joystick.addEventListener("touchmove", function(e) {
  e.preventDefault();

  if (joystickActive) {
    moveJoystick(
      e.touches[0].clientX,
      e.touches[0].clientY
    );
  }
});

joystick.addEventListener("touchend", function() {
  joystickActive = false;

  joystickX = 0;
  joystickY = 0;

  stick.style.left = "50%";
  stick.style.top = "50%";
});

/* SHOOT BUTTON */

const shootButton = document.getElementById("shootButton");

shootButton.addEventListener("touchstart", function(e) {
  e.preventDefault();
  shoot();
});

/* GAME LOOP */

function update() {

  let speed = 0.45;

  let moveX = 0;
  let moveY = 0;

  /* KEYBOARD */

  if (keys["a"]) {
    moveX -= 1;
    playerDirection = -1;
  }

  if (keys["d"]) {
    moveX += 1;
    playerDirection = 1;
  }

  if (keys["w"]) moveY -= 1;
  if (keys["s"]) moveY += 1;

  /* JOYSTICK */

  moveX += joystickX;
  moveY += joystickY;

  playerX += moveX * speed;
  playerY += moveY * speed;

  /* PLAYER BOUNDARIES */

  playerX = Math.max(5, Math.min(95, playerX));
  playerY = Math.max(5, Math.min(95, playerY));

  /* BALL */

  ballX += ballVX;
  ballY += ballVY;

  ballVX *= 0.96;
  ballVY *= 0.96;

  /* BALL TOP/BOTTOM */

  if (ballY <= 2) {
    ballY = 2;
    ballVY *= -0.7;
  }

  if (ballY >= 98) {
    ballY = 98;
    ballVY *= -0.7;
  }

  /* BALL LEFT/RIGHT */

  if (ballX <= 2) {

    if (ballY >= 36 && ballY <= 64) {

      blueScore++;
      resetBall();

    } else {

      ballX = 2;
      ballVX *= -0.7;
    }
  }

  if (ballX >= 98) {

    if (ballY >= 36 && ballY <= 64) {

      redScore++;
      resetBall();

    } else {

      ballX = 98;
      ballVX *= -0.7;
    }
  }

  /* PLAYER KICKS BALL */

  let playerDistance = Math.hypot(
    ballX - playerX,
    ballY - playerY
  );

  if (playerDistance < 5) {

    if (Math.abs(moveX) > 0.1) {
      ballVX = moveX * 0.8;
    }

    if (Math.abs(moveY) > 0.1) {
      ballVY = moveY * 0.6;
    }
  }

  /* BOT */

  let dx = ballX - botX;
  let dy = ballY - botY;

  botX += Math.sign(dx) * 0.22;
  botY += Math.sign(dy) * 0.22;

  botX = Math.max(5, Math.min(95, botX));
  botY = Math.max(5, Math.min(95, botY));

  botShoot();

  /* DISPLAY */

  player.style.left = playerX + "%";
  player.style.top = playerY + "%";

  bot.style.left = botX + "%";
  bot.style.top = botY + "%";

  ball.style.left = ballX + "%";
  ball.style.top = ballY + "%";

  scoreText.textContent =
    `BLUE ${blueScore} - ${redScore} RED`;

  requestAnimationFrame(update);
}

/* RESET BALL */

function resetBall() {

  ballX = 50;
  ballY = 50;

  ballVX = 0;
  ballVY = 0;

  playerX = 25;
  playerY = 50;

  botX = 75;
  botY = 50;
}

/* TIMER */

setInterval(function() {

  if (timeLeft > 0) {
    timeLeft--;
    timerText.textContent = timeLeft;
  }

}, 1000);

update();
</script>

</body>
</html>
