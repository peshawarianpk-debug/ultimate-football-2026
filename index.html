<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Ultimate Football 2026</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
}

body{
overflow-x:hidden;
}

button{
background:#111;
color:#fff;
border:2px solid #fff;
border-radius:10px;
padding:12px 18px;
margin:6px;
font-size:16px;
font-weight:bold;
cursor:pointer;
touch-action:manipulation;
}

button:active{
transform:scale(.94);
}

.screen{
display:none;
min-height:100vh;
padding:15px;
}

.active{
display:block;
}

h1{
font-size:clamp(25px,5vw,48px);
}

.menu{
width:min(430px,92vw);
margin:40px auto;
}

.menu button{
display:block;
width:100%;
margin:15px 0;
font-size:19px;
}

#score{
font-size:28px;
font-weight:bold;
}

#timer{
font-size:20px;
margin:8px;
}

/* FIELD */

#field{
position:relative;
width:min(900px,94vw);
aspect-ratio:16/9;
margin:15px auto;
background:#159447;
border:4px solid #fff;
overflow:visible;
touch-action:none;
}

.centerLine{
position:absolute;
left:50%;
top:0;
width:3px;
height:100%;
background:#fff;
}

.centerCircle{
position:absolute;
left:50%;
top:50%;
width:18%;
aspect-ratio:1;
transform:translate(-50%,-50%);
border:3px solid #fff;
border-radius:50%;
}

.centerSpot{
position:absolute;
left:50%;
top:50%;
width:10px;
height:10px;
transform:translate(-50%,-50%);
background:#fff;
border-radius:50%;
}

.penalty{
position:absolute;
top:25%;
width:14%;
height:50%;
border:3px solid #fff;
}

.penalty.left{
left:0;
border-left:0;
}

.penalty.right{
right:0;
border-right:0;
}

/* GOAL AREA */

.goal{
position:absolute;
top:36%;
width:7%;
height:28%;
border:4px solid #fff;
background:rgba(255,255,255,.08);
z-index:2;
}

.goal.left{
left:-1%;
}

.goal.right{
right:-1%;
}

/* NET */

.net{
position:absolute;
top:36%;
width:6%;
height:28%;
border-top:3px solid #aaa;
border-bottom:3px solid #aaa;
background:
repeating-linear-gradient(
90deg,
transparent 0 6px,
#aaa 7px 8px
);
z-index:1;
}

.net.left{
right:100%;
}

.net.right{
left:100%;
}

/* PLAYERS */

.player,
.bot,
.keeper,
.botKeeper,
.referee,
.ball{
position:absolute;
transform:translate(-50%,-50%);
}

.player{
width:34px;
height:34px;
border-radius:50%;
background:#1685ff;
border:3px solid #fff;
z-index:6;
}

.bot{
width:34px;
height:34px;
border-radius:50%;
background:#e02020;
border:3px solid #fff;
z-index:6;
}

.keeper{
width:38px;
height:38px;
border-radius:8px;
background:#00aaff;
border:3px solid #fff;
z-index:6;
}

.botKeeper{
width:38px;
height:38px;
border-radius:8px;
background:#ff5500;
border:3px solid #fff;
z-index:6;
}

.referee{
width:34px;
height:34px;
border-radius:50%;
background:#ffd900;
border:4px solid #111;
z-index:7;
font-weight:bold;
font-size:17px;
line-height:26px;
color:#111;
}

.ball{
width:18px;
height:18px;
border-radius:50%;
background:#fff;
border:2px solid #111;
z-index:9;
}

/* CONTROLS */

#mobileControls{
display:flex;
flex-direction:column;
align-items:center;
margin:12px auto;
}

.controlRow{
display:flex;
justify-content:center;
}

#mobileControls button{
width:65px;
height:55px;
padding:4px;
font-size:22px;
}

#shoot{
width:145px!important;
font-size:17px!important;
}

/* ADMIN */

.panel{
width:min(500px,92vw);
margin:25px auto;
padding:20px;
border:2px solid #fff;
border-radius:15px;
background:#080808;
}

.panel input{
width:90%;
padding:13px;
background:#111;
color:#fff;
border:2px solid #fff;
border-radius:8px;
font-size:17px;
}

.stat{
background:#151515;
padding:12px;
margin:8px;
border-radius:8px;
}

#adminContent{
display:none;
}

@media(max-width:700px){

#field{
width:96vw;
}

.player,
.bot{
width:27px;
height:27px;
}

.keeper,
.botKeeper{
width:30px;
height:30px;
}

.ball{
width:15px;
height:15px;
}

.referee{
width:27px;
height:27px;
font-size:13px;
line-height:20px;
}

}
</style>
</head>

<body>

<!-- MENU -->

<section id="menu" class="screen active">

<h1>⚽ ULTIMATE FOOTBALL 2026</h1>

<div class="menu">

<button onclick="startMatch()">
🎮 QUICK MATCH
</button>

<button onclick="openTournament()">
🏆 TOURNAMENT
</button>

<button onclick="openAdmin()">
👑 ADMIN PANEL
</button>

</div>

<p>
💻 PC • Laptop • Mac
<br>
📱 Android • iPhone • iPad
</p>

</section>


<!-- GAME -->

<section id="gameScreen" class="screen">

<h1>⚽ ULTIMATE FOOTBALL 2026</h1>

<div id="score">
BLUE 0 - 0 RED
</div>

<div id="timer">
TIME: 90
</div>


<div id="field">

<div class="centerLine"></div>
<div class="centerCircle"></div>
<div class="centerSpot"></div>

<div class="penalty left"></div>
<div class="penalty right"></div>

<!-- GOALS -->

<div class="goal left"></div>
<div class="goal right"></div>

<!-- NETS -->

<div class="net left"></div>
<div class="net right"></div>

<!-- PLAYERS -->

<div id="player" class="player"></div>

<div id="keeper" class="keeper"></div>

<div id="bot" class="bot"></div>

<div id="botKeeper" class="botKeeper"></div>

<div id="referee" class="referee">
R
</div>

<div id="ball" class="ball"></div>

</div>


<p>
💻 WASD + SPACE
<br>
📱 Touch Controls
</p>


<!-- TOUCH -->

<div id="mobileControls">

<div class="controlRow">
<button id="up">⬆️</button>
</div>

<div class="controlRow">
<button id="left">⬅️</button>
<button id="down">⬇️</button>
<button id="right">➡️</button>
</div>

<div class="controlRow">
<button id="shoot">⚽ SHOOT</button>
</div>

</div>

<button onclick="restartMatch()">
🔄 RESTART
</button>

<button onclick="backMenu()">
🏠 MENU
</button>

</section>


<!-- TOURNAMENT -->

<section id="tournamentScreen" class="screen">

<h1>🏆 ULTIMATE CUP 2026</h1>

<div class="panel">

<div class="stat">Quarter Final</div>
<div class="stat">Semi Final</div>
<div class="stat">🏆 FINAL</div>

<button onclick="startMatch()">
▶ PLAY MATCH
</button>

<button onclick="backMenu()">
🏠 MENU
</button>

</div>

</section>


<!-- ADMIN -->

<section id="adminScreen" class="screen">

<h1>👑 ADMIN PANEL</h1>

<div id="adminLogin" class="panel">

<h2>🔐 ADMIN LOGIN</h2>

<input
id="adminPassword"
type="password"
placeholder="Admin password"
>

<br>

<button onclick="loginAdmin()">
LOGIN
</button>

<button onclick="backMenu()">
BACK
</button>

<p id="loginMessage"></p>

</div>


<div id="adminContent" class="panel">

<h2>⚙️ GAME CONTROL</h2>

<div class="stat">
BLUE SCORE:
<strong id="adminBlue">0</strong>
</div>

<div class="stat">
RED SCORE:
<strong id="adminRed">0</strong>
</div>

<div class="stat">
TIME:
<strong id="adminTime">90</strong>
</div>

<button onclick="adminBlueGoal()">
⚽ BLUE GOAL
</button>

<button onclick="adminRedGoal()">
🔴 RED GOAL
</button>

<br>

<button onclick="activateCheat()">
🔥 CHEAT MODE
</button>

<button onclick="restartMatch()">
🔄 RESET MATCH
</button>

<br>

<button onclick="backMenu()">
🏠 MENU
</button>

</div>

</section>


<script>

/* VARIABLES */

let px=25;
let py=50;

let bx=75;
let by=50;

let keeperX=6;
let keeperY=50;

let botKeeperX=94;
let botKeeperY=50;

let ballX=50;
let ballY=50;

let ballVX=0;
let ballVY=0;

let refereeX=50;
let refereeY=40;

let blueScore=0;
let redScore=0;

let timeLeft=90;

let gameRunning=false;

let cheatMode=false;

let keys={};

let playerDirection=1;
let botDirection=-1;

let botShootCooldown=0;


/* ELEMENTS */

const player=document.getElementById("player");
const bot=document.getElementById("bot");
const keeper=document.getElementById("keeper");
const botKeeper=document.getElementById("botKeeper");
const ball=document.getElementById("ball");
const referee=document.getElementById("referee");
const score=document.getElementById("score");
const timer=document.getElementById("timer");


/* SCREENS */

function showScreen(id){

document.querySelectorAll(".screen").forEach(function(s){
s.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}


/* START */

function startMatch(){

showScreen("gameScreen");

restartMatch();

gameRunning=true;

}


/* RESET */

function restartMatch(){

px=25;
py=50;

bx=75;
by=50;

keeperX=6;
keeperY=50;

botKeeperX=94;
botKeeperY=50;

ballX=50;
ballY=50;

ballVX=0;
ballVY=0;

refereeX=50;
refereeY=40;

blueScore=0;
redScore=0;

timeLeft=90;

cheatMode=false;

playerDirection=1;
botDirection=-1;

botShootCooldown=0;

update();

}


/* MENU */

function backMenu(){

gameRunning=false;

showScreen("menu");

}


function openTournament(){

gameRunning=false;

showScreen("tournamentScreen");

}


function openAdmin(){

gameRunning=false;

showScreen("adminScreen");

}


/* KEYBOARD */

document.addEventListener("keydown",function(e){

keys[e.key.toLowerCase()]=true;


/* PLAYER FACING */

if(e.key.toLowerCase()==="a"){
playerDirection=-1;
}

if(e.key.toLowerCase()==="d"){
playerDirection=1;
}


/* SHOOT */

if(e.code==="Space"){

shoot();

e.preventDefault();

}


/* CHEAT */

if(e.shiftKey && e.key==="1"){

activateCheat();

}

});


document.addEventListener("keyup",function(e){

keys[e.key.toLowerCase()]=false;

});


/* TOUCH */

function control(id,key){

const b=document.getElementById(id);

b.addEventListener("pointerdown",function(e){

e.preventDefault();

keys[key]=true;

if(key==="a"){
playerDirection=-1;
}

if(key==="d"){
playerDirection=1;
}

});

b.addEventListener("pointerup",function(e){

e.preventDefault();

keys[key]=false;

});

b.addEventListener("pointercancel",function(){

keys[key]=false;

});

b.addEventListener("pointerleave",function(){

keys[key]=false;

});

}


control("up","w");
control("down","s");
control("left","a");
control("right","d");


document.getElementById("shoot")
.addEventListener("pointerdown",function(e){

e.preventDefault();

shoot();

});


/* GAME MOVEMENT */

function move(){

if(!gameRunning)return;


/* PLAYER */

let playerSpeed=.75;

if(keys["w"])py-=playerSpeed;

if(keys["s"])py+=playerSpeed;

if(keys["a"]){

px-=playerSpeed;
playerDirection=-1;

}

if(keys["d"]){

px+=playerSpeed;
playerDirection=1;

}

px=Math.max(4,Math.min(96,px));

py=Math.max(6,Math.min(94,py));


/* BOT AI */

let botSpeed=cheatMode?.35:.55;

if(ballX<bx){

bx-=botSpeed;
botDirection=-1;

}

if(ballX>bx){

bx+=botSpeed;
botDirection=1;

}

if(ballY<by){
by-=botSpeed;
}

if(ballY>by){
by+=botSpeed;
}

bx=Math.max(15,Math.min(85,bx));

by=Math.max(8,Math.min(92,by));


/* BOT SHOOT */

botShootCooldown--;

let botDX=ballX-bx;
let botDY=ballY-by;

let botDistance=Math.sqrt(
botDX*botDX+
botDY*botDY
);


/*
BOT CAN SHOOT LEFT OR RIGHT.
*/

if(botDistance<7 && botShootCooldown<=0){

let power=cheatMode?2.6:1.8;


/*
Sometimes shoot toward the blue goal.
Sometimes shoot back toward the right.
*/

if(Math.random()<0.75){

botDirection=-1;

}else{

botDirection=1;

}

ballVX=botDirection*power;

ballVY=(ballY-by)*0.08;

botShootCooldown=65;

}


/* BALL */

ballX+=ballVX;
ballY+=ballVY;

ballVX*=.975;
ballVY*=.975;


/* VERTICAL BOUNCE */

if(ballY<3){

ballY=3;

ballVY=Math.abs(ballVY);

}

if(ballY>97){

ballY=97;

ballVY=-Math.abs(ballVY);

}


/* PLAYER CONTROLS BALL */

let dx=ballX-px;
let dy=ballY-py;

let playerDistance=Math.sqrt(
dx*dx+
dy*dy
);

if(playerDistance<6 && Math.abs(ballVX)<1){

ballX=px+playerDirection*3;

ballY=py;

}


/* BOT CONTROLS BALL */

let bdx=ballX-bx;
let bdy=ballY-by;

let currentBotDistance=Math.sqrt(
bdx*bdx+
bdy*bdy
);

if(currentBotDistance<6 && Math.abs(ballVX)<1){

ballX=bx+botDirection*3;

ballY=by;

}


/* BLUE KEEPER */

if(keeperY<ballY)
keeperY+=.5;

if(keeperY>ballY)
keeperY-=.5;

keeperY=Math.max(
34,
Math.min(66,keeperY)
);


/* RED KEEPER */

if(botKeeperY<ballY)
botKeeperY+=.5;

if(botKeeperY>ballY)
botKeeperY-=.5;

botKeeperY=Math.max(
34,
Math.min(66,botKeeperY)
);


/* KEEPER SAVES */

if(
Math.abs(ballX-keeperX)<5 &&
Math.abs(ballY-keeperY)<12
){

if(ballVX<0){

ballVX=1.9;

ballVY=(ballY-keeperY)*.1;

}

}


if(
Math.abs(ballX-botKeeperX)<5 &&
Math.abs(ballY-botKeeperY)<12
){

if(ballVX>0){

ballVX=-1.9;

ballVY=(ballY-botKeeperY)*.1;

}

}


/* REFEREE */

refereeX=
50+
Math.sin(Date.now()/900)*18;

refereeY=
50+
Math.cos(Date.now()/1100)*12;


/* GOAL DETECTION */


/* RIGHT GOAL = BLUE SCORE */

if(
ballX>97 &&
ballY>36 &&
ballY<64
){

blueScore++;

resetPositions();

}


/* LEFT GOAL = RED SCORE */

if(
ballX<3 &&
ballY>36 &&
ballY<64
){

redScore++;

resetPositions();

}


update();

}


/* PLAYER SHOOT */

function shoot(){

if(!gameRunning)return;

let dx=ballX-px;
let dy=ballY-py;

let distance=Math.sqrt(
dx*dx+
dy*dy
);


if(distance<11){

let power=cheatMode?2.8:2.0;


/*
SHOOT LEFT OR RIGHT
depending on player's last direction.
*/

ballVX=playerDirection*power;

ballVY=(ballY-py)*.08;

}

}


/* RESET POSITIONS */

function resetPositions(){

px=25;
py=50;

bx=75;
by=50;

keeperX=6;
keeperY=50;

botKeeperX=94;
botKeeperY=50;

ballX=50;
ballY=50;

ballVX=0;
ballVY=0;

botShootCooldown=40;

}


/* UPDATE */

function update(){

player.style.left=px+"%";
player.style.top=py+"%";

bot.style.left=bx+"%";
bot.style.top=by+"%";

keeper.style.left=keeperX+"%";
keeper.style.top=keeperY+"%";

botKeeper.style.left=botKeeperX+"%";
botKeeper.style.top=botKeeperY+"%";

ball.style.left=ballX+"%";
ball.style.top=ballY+"%";

referee.style.left=refereeX+"%";
referee.style.top=refereeY+"%";


score.textContent=
"BLUE "+
blueScore+
" - "+
redScore+
" RED";

timer.textContent=
"TIME: "+
timeLeft;


document.getElementById("adminBlue").textContent=blueScore;

document.getElementById("adminRed").textContent=redScore;

document.getElementById("adminTime").textContent=timeLeft;

}


/* TIMER */

setInterval(function(){

if(
gameRunning &&
timeLeft>0
){

timeLeft--;

update();

}


if(
gameRunning &&
timeLeft<=0
){

gameRunning=false;

alert(
"FULL TIME!\n\nBLUE "+
blueScore+
" - "+
redScore+
" RED"
);

}

},1000);


/* GAME LOOP */

setInterval(move,20);


/* ADMIN LOGIN */

function loginAdmin(){

const password=
document.getElementById(
"adminPassword"
).value;


if(password==="umar bau"){

document.getElementById(
"adminLogin"
).style.display="none";

document.getElementById(
"adminContent"
).style.display="block";

}else{

document.getElementById(
"loginMessage"
).textContent=
"❌ WRONG PASSWORD";

}

}


/* ADMIN GOALS */

function adminBlueGoal(){

blueScore++;

update();

}


function adminRedGoal(){

redScore++;

update();

}


/* CHEAT */

function activateCheat(){

cheatMode=true;

alert(
"🔥 CHEAT MODE ACTIVATED!"
);

}


/* INITIAL */

update();

</script>

</body>
</html>
