<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Ultimate Football 2026</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
}

body{
overflow-x:hidden;
}

button{
background:#111;
color:white;
border:2px solid white;
border-radius:10px;
padding:12px 20px;
margin:6px;
font-size:16px;
font-weight:bold;
touch-action:manipulation;
}

button:active{
transform:scale(.94);
}

.screen{
display:none;
min-height:100vh;
padding:15px;
}

.active{
display:block;
}

h1{
font-size:clamp(25px,5vw,48px);
}

.menu{
width:min(430px,92vw);
margin:40px auto;
}

.menu button{
display:block;
width:100%;
font-size:19px;
margin:15px 0;
}

/* SCORE */

#score{
font-size:28px;
font-weight:bold;
}

#timer{
font-size:20px;
margin:8px;
}

/* FIELD */

#field{
position:relative;
width:min(900px,94vw);
aspect-ratio:16/9;
margin:10px auto;
background:#159447;
border:4px solid white;
overflow:visible;
touch-action:none;
}

/* FIELD LINES */

.line{
position:absolute;
background:white;
}

.centerLine{
width:3px;
height:100%;
left:50%;
top:0;
}

.centerCircle{
position:absolute;
width:18%;
aspect-ratio:1;
left:50%;
top:50%;
transform:translate(-50%,-50%);
border:3px solid white;
border-radius:50%;
}

.centerSpot{
position:absolute;
width:12px;
height:12px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:white;
border-radius:50%;
}

/* PENALTY AREAS */

.penalty{
position:absolute;
width:14%;
height:48%;
top:26%;
border:3px solid white;
}

.penalty.left{
left:0;
border-left:0;
}

.penalty.right{
right:0;
border-right:0;
}

/* GOALS INSIDE FIELD */

.goal{
position:absolute;
width:7%;
height:25%;
top:37.5%;
border:4px solid white;
background:transparent;
z-index:1;
}

.goal.left{
left:0;
border-left:0;
}

.goal.right{
right:0;
border-right:0;
}

/* NETS OUTSIDE FIELD */

.net{
position:absolute;
width:4%;
height:25%;
top:37.5%;
border:3px solid #aaa;
background:repeating-linear-gradient(
90deg,
transparent 0 7px,
#aaa 8px 9px
);
z-index:0;
}

.net.left{
right:100%;
}

.net.right{
left:100%;
}

/* PLAYERS */

.player,.bot,.referee,.ball{
position:absolute;
transform:translate(-50%,-50%);
z-index:5;
}

.player{
width:34px;
height:34px;
border-radius:50%;
background:#1685ff;
border:3px solid white;
}

.bot{
width:34px;
height:34px;
border-radius:50%;
background:#e02020;
border:3px solid white;
}

.referee{
width:27px;
height:27px;
border-radius:50%;
background:#ffd21f;
border:3px solid #111;
font-size:14px;
line-height:21px;
}

.ball{
width:18px;
height:18px;
border-radius:50%;
background:white;
border:2px solid #111;
z-index:6;
}

/* TOUCH */

#mobileControls{
display:flex;
flex-direction:column;
align-items:center;
margin:12px auto;
}

.controlRow{
display:flex;
justify-content:center;
}

#mobileControls button{
width:65px;
height:55px;
font-size:22px;
padding:5px;
}

#shoot{
width:140px !important;
font-size:17px !important;
}

/* PANELS */

.panel{
width:min(500px,92vw);
margin:25px auto;
padding:20px;
border:2px solid white;
border-radius:15px;
background:#080808;
}

.panel input{
width:90%;
padding:13px;
background:#111;
color:white;
border:2px solid white;
border-radius:8px;
font-size:17px;
}

.stat{
background:#151515;
padding:12px;
margin:8px;
border-radius:8px;
}

#adminContent{
display:none;
}

@media(max-width:700px){

#field{
width:96vw;
}

.player,.bot{
width:27px;
height:27px;
}

.ball{
width:15px;
height:15px;
}

.referee{
width:23px;
height:23px;
font-size:11px;
}

}

@media(min-width:701px){

#mobileControls{
opacity:.65;
}

}
</style>
</head>

<body>

<!-- MENU -->

<section id="menu" class="screen active">

<h1>⚽ ULTIMATE FOOTBALL 2026</h1>

<div class="menu">

<button onclick="startMatch()">🎮 QUICK MATCH</button>

<button onclick="openTournament()">🏆 TOURNAMENT</button>

<button onclick="openAdmin()">👑 ADMIN PANEL</button>

</div>

<p>💻 PC • Laptop • Mac • 📱 Phone • iPad</p>

</section>


<!-- GAME -->

<section id="gameScreen" class="screen">

<h1>⚽ ULTIMATE FOOTBALL 2026</h1>

<div id="score">BLUE 0 - 0 RED</div>

<div id="timer">TIME: 90</div>

<div id="field">

<div class="centerLine"></div>

<div class="centerCircle"></div>

<div class="centerSpot"></div>

<div class="penalty left"></div>

<div class="penalty right"></div>

<div class="goal left"></div>

<div class="goal right"></div>

<div class="net left"></div>

<div class="net right"></div>

<div id="player" class="player"></div>

<div id="bot" class="bot"></div>

<div id="referee" class="referee">R</div>

<div id="ball" class="ball"></div>

</div>


<p>
💻 WASD + SPACE
<br>
📱 Touch controls below
</p>


<!-- TOUCH CONTROLS -->

<div id="mobileControls">

<div class="controlRow">
<button id="up">⬆️</button>
</div>

<div class="controlRow">
<button id="left">⬅️</button>
<button id="down">⬇️</button>
<button id="right">➡️</button>
</div>

<div class="controlRow">
<button id="shoot">⚽ SHOOT</button>
</div>

</div>


<button onclick="restartMatch()">🔄 RESTART</button>

<button onclick="backMenu()">🏠 MENU</button>

</section>


<!-- TOURNAMENT -->

<section id="tournamentScreen" class="screen">

<h1>🏆 ULTIMATE CUP 2026</h1>

<div class="panel">

<div class="stat">Quarter Final</div>

<div class="stat">Semi Final</div>

<div class="stat">🏆 FINAL</div>

<button onclick="startMatch()">▶ PLAY</button>

<button onclick="backMenu()">🏠 MENU</button>

</div>

</section>


<!-- ADMIN -->

<section id="adminScreen" class="screen">

<h1>👑 ADMIN PANEL</h1>

<div id="adminLogin" class="panel">

<h2>🔐 ADMIN LOGIN</h2>

<input
id="adminPassword"
type="password"
placeholder="Admin password">

<br>

<button onclick="loginAdmin()">LOGIN</button>

<button onclick="backMenu()">BACK</button>

<p id="loginMessage"></p>

</div>


<div id="adminContent" class="panel">

<h2>⚙️ GAME CONTROL</h2>

<div class="stat">
BLUE SCORE:
<strong id="adminBlue">0</strong>
</div>

<div class="stat">
RED SCORE:
<strong id="adminRed">0</strong>
</div>

<div class="stat">
TIME:
<strong id="adminTime">90</strong>
</div>

<button onclick="adminBlueGoal()">⚽ BLUE GOAL</button>

<button onclick="adminRedGoal()">🔴 RED GOAL</button>

<br>

<button onclick="activateCheat()">🔥 CHEAT MODE</button>

<button onclick="restartMatch()">🔄 RESET</button>

<br>

<button onclick="backMenu()">🏠 MENU</button>

</div>

</section>


<script>

/* GAME VARIABLES */

let px=25;
let py=50;

let bx=75;
let by=50;

let ballX=50;
let ballY=50;

let refereeX=50;
let refereeY=42;

let blueScore=0;
let redScore=0;

let timeLeft=90;

let gameRunning=false;

let cheatMode=false;

let keys={};


/* ELEMENTS */

const field=document.getElementById("field");

const player=document.getElementById("player");

const bot=document.getElementById("bot");

const ball=document.getElementById("ball");

const referee=document.getElementById("referee");

const score=document.getElementById("score");

const timer=document.getElementById("timer");


/* SCREEN */

function showScreen(id){

document.querySelectorAll(".screen").forEach(s=>{
s.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}


/* START */

function startMatch(){

showScreen("gameScreen");

restartMatch();

gameRunning=true;

}


/* RESET */

function restartMatch(){

px=25;
py=50;

bx=75;
by=50;

ballX=50;
ballY=50;

refereeX=50;
refereeY=42;

blueScore=0;
redScore=0;

timeLeft=90;

cheatMode=false;

update();

}


/* MENU */

function backMenu(){

gameRunning=false;

showScreen("menu");

}


function openTournament(){

gameRunning=false;

showScreen("tournamentScreen");

}


function openAdmin(){

gameRunning=false;

showScreen("adminScreen");

}


/* KEYBOARD */

document.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

if(e.code==="Space"){

shoot();

e.preventDefault();

}

if(e.shiftKey && e.key==="1"){

activateCheat();

}

});


document.addEventListener("keyup",e=>{

keys[e.key.toLowerCase()]=false;

});


/* TOUCH */

function touchControl(id,key){

const button=document.getElementById(id);

button.addEventListener("pointerdown",e=>{

e.preventDefault();

keys[key]=true;

});

button.addEventListener("pointerup",e=>{

e.preventDefault();

keys[key]=false;

});

button.addEventListener("pointercancel",e=>{

keys[key]=false;

});

button.addEventListener("pointerleave",e=>{

keys[key]=false;

});

}


touchControl("up","w");

touchControl("down","s");

touchControl("left","a");

touchControl("right","d");


document.getElementById("shoot").addEventListener(
"pointerdown",
e=>{

e.preventDefault();

shoot();

}
);


/* MOVEMENT */

function move(){

if(!gameRunning)return;


/* PLAYER */

let speed=0.7;

if(keys["w"])py-=speed;

if(keys["s"])py+=speed;

if(keys["a"])px-=speed;

if(keys["d"])px+=speed;


/* FIELD LIMITS */

px=Math.max(4,Math.min(96,px));

py=Math.max(5,Math.min(95,py));


/* BOT AI */

let botSpeed=cheatMode?0.25:0.38;

if(by<ballY)by+=botSpeed;

if(by>ballY)by-=botSpeed;

if(bx<ballX)bx+=botSpeed;

if(bx>ballX)bx-=botSpeed;


/* BALL FOLLOW PLAYER */

let dx=ballX-px;

let dy=ballY-py;

let distance=Math.sqrt(dx*dx+dy*dy);

if(distance<5){

ballX=px+3;

ballY=py;

}


/* BALL FOLLOW BOT */

let bdx=ballX-bx;

let bdy=ballY-by;

let botDistance=Math.sqrt(bdx*bdx+bdy*bdy);

if(botDistance<4){

ballX=bx-3;

ballY=by;

}


/* REFEREE */

refereeX=50+Math.sin(Date.now()/900)*18;

refereeY=50+Math.cos(Date.now()/1200)*12;


/* GOALS */

if(ballX>=98){

blueScore++;

resetPositions();

}

if(ballX<=2){

redScore++;

resetPositions();

}


update();

}


/* SHOOT */

function shoot(){

if(!gameRunning)return;


let dx=ballX-px;

let dy=ballY-py;

let distance=Math.sqrt(dx*dx+dy*dy);


if(distance<10){

ballX+=cheatMode?18:10;

}

}


/* RESET POSITIONS */

function resetPositions(){

ballX=50;

ballY=50;

px=25;

py=50;

bx=75;

by=50;

}


/* UPDATE */

function update(){

player.style.left=px+"%";

player.style.top=py+"%";

bot.style.left=bx+"%";

bot.style.top=by+"%";

ball.style.left=ballX+"%";

ball.style.top=ballY+"%";

referee.style.left=refereeX+"%";

referee.style.top=refereeY+"%";


score.textContent=
"BLUE "+blueScore+" - "+redScore+" RED";

timer.textContent=
"TIME: "+timeLeft;


document.getElementById("adminBlue").textContent=blueScore;

document.getElementById("adminRed").textContent=redScore;

document.getElementById("adminTime").textContent=timeLeft;

}


/* TIMER */

setInterval(()=>{

if(gameRunning && timeLeft>0){

timeLeft--;

update();

}

if(gameRunning && timeLeft<=0){

gameRunning=false;

alert(
"FULL TIME!\n\nBLUE "+
blueScore+
" - "+
redScore+
" RED"
);

}

},1000);


/* GAME LOOP */

setInterval(move,20);


/* ADMIN LOGIN */

function loginAdmin(){

const password=
document.getElementById("adminPassword").value;

if(password==="umar bau"){

document.getElementById("adminLogin").style.display="none";

document.getElementById("adminContent").style.display="block";

}else{

document.getElementById("loginMessage").textContent=
"❌ WRONG PASSWORD";

}

}


/* ADMIN */

function adminBlueGoal(){

blueScore++;

update();

}


function adminRedGoal(){

redScore++;

update();

}


/* CHEAT */

function activateCheat(){

cheatMode=true;

alert("🔥 CHEAT MODE ACTIVATED!");

}


/* START */

update();

</script>

</body>
</html>
